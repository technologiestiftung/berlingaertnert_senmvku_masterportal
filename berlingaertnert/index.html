<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=0"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Berlin Gärtnert</title>
    <!-- enter your own Portal Title for the website at this -->
    <link rel="stylesheet" href="./mastercode/3_7_0/css/masterportal.css" />
    <!-- <link rel="stylesheet" href="" /> -->
    <link rel="stylesheet" href="./resources/css/berlin_icons.css">
    <!-- Here you can configure your own fonts as url -->
    <style>
      .mp-menu-logo img {
        max-height: 100px !important;
      }
      /* map Berlin CI icons onto Master Portal defaults*/
      .bi-info-circle:before {
        content: "\e826";
        font-family: "berlin_icons" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 30px;
      }

      .bi-info-circle-fill:before {
        content: "\e826";
        font-family: "berlin_icons" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 30px;
      }

      .bi-globe:before {
        content: "\e835";
        font-family: "berlin_icons" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 24px;
      }

      @font-face {
        font-family: "fontello";
        src: url("./resources/font/fontello.eot?17504900");
        src: url("./resources/font/fontello.eot?17504900#iefix")
            format("embedded-opentype"),
          url("./resources/font/fontello.woff?17504900") format("woff"),
          url("./resources/font/fontello.ttf?17504900") format("truetype"),
          url("./resources/font/fontello.svg?17504900#fontello") format("svg");
        font-weight: normal;
        font-style: normal;
      }

      .icon-berlin-placemarker:before {
        content: "\e800";
        font-family: "fontello" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 24px;
      }
      .icon-berlin-outline-filled:before {
        content: "\e80f";
        font-family: "fontello" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 24px;
      }
      .icon-berlin-outline:before {
        content: "\e801";
        font-family: "fontello" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 24px;
      }
      .icon-berlin-outline-heart:before {
        content: "\e802";
        font-family: "fontello" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 24px;
      }
      .icon-berlin-bulb:before {
        content: "\e803";
        font-family: "fontello" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 24px;
      }
      .icon-berlin-heart:before {
        content: "\e804";
        font-family: "fontello" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 24px;
      }
      .icon-berlin-flag:before {
        content: "\e805";
        font-family: "fontello" !important;
        position: relative;
        top: 0px;
        left: 0;
        font-size: 24px;
      }
      .icon-odis{
        display: inline-block;
        width: 221px;
        height: 55px;
        background-image: url("https://logos.citylab-berlin.org/logo-odis-berlin-black.svg"); /* or .png */
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      .icon-citylab{
        display: inline-block; 
        width: 200px; /* ratio -> height = width / 4.67 */
        height: 42.8px;
        background-image: url("https://logos.citylab-berlin.org/logo-citylab-berlin-outline.svg"); /* or .png */
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      .icon-senatskanzlei{
        display: inline-block; 
        width: 240px; /* ratio -> height = width / 6 */
        height: 40px;
        background-image: url("https://logos.citylab-berlin.org/logo-senatskanzlei-buergermeister-horizontal-schwarz.svg"); /* or .png */
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      .icon-technologiestiftung{
        display: inline-block; 
        width: 200px; /* ratio -> height = width / 3.33 */
        height: 60px;
        background-image: url("https://logos.citylab-berlin.org/logo-technologiestiftung-berlin-de.svg"); /* or .png */
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      #accordion-container-layer-info-contact {
        display: none;
      }
      a[href="resources/data/metadata/beetpatenschaften.xml"] {
        display: none;
      }
      a[href="resources/data/metadata/flaechenpotentiale.xml"] {
        display: none;
      }
      a[href="resources/data/metadata/gartenarbeitschulen.xml"] {
        display: none;
      }
      a[href="resources/data/metadata/gemeinschaftsgaerten.xml"] {
        display: none;
      }
      a[href="resources/data/metadata/kitaschulgaerten.xml"] {
        display: none;
      }
      a[href="resources/data/metadata/parklets.xml"] {
        display: none;
      }
      a[href="resources/data/metadata/selbsterntegaerten.xml"] {
        display: none;
      }
      a[href="resources/data/metadata/solidarischelandwirtschaft.xml"] {
        display: none;
      }
      a[href="resources/data/metadata/basemap.xml"] {
        display: none;
      }
      a[href="resources/data/metadata/basemap_bkg.xml"] {
        display: none;
      }
      .btn-primary[id="add-layer-btn"] { /* add layer button coloring */
          --bs-btn-color: #000000 !important;
          --bs-btn-bg: #9bcfaf !important;
          --bs-btn-hover-color: #ffff !important;
          --bs-btn-hover-bg: #423865 !important;
          --bs-btn-hover-border-color: #423865 !important;
      }
      .btn-primary[id="search-button"]{ /* search button 'color' adjustment from initial opacity */
          --bs-btn-disabled-opacity: 1 !important;
      }
      .layer-component-icon-sub-menu{ /* disable opacity slider */
        display: none !important;
      }
      .layerPreview[title] {
         pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="masterportal-root"></div>
    <script
